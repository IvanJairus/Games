name: CI & Auto-Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# cancel-in-progress sengaja dimatikan: dua deploy produksi yang tumpang tindih
# meninggalkan deployment dengan HTML dan aset dari build berbeda, dan browser
# menyimpan respons HTML itu sebagai JS selama setahun karena header immutable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  audit-and-test:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc -b

      - name: Run Game Engine Unit Tests
        run: npm run test:unit

      - name: Run Viewport UI Automation (Desktop & Mobile)
        run: npm run test:ui

      - name: Run Release Readiness Audit
        run: npm run release:check

      - name: Security & Domain Guard Check
        run: npm run guard:check

      # Needs no npm package and no built artifact: it raises its own throwaway Postgres in
      # Docker and applies the migrations. Last in the job on purpose, so a red run here says
      # something about the SQL and never hides the steps above it.
      - name: Verify SQL Migrations and Protocol Assertions
        run: npm run db:verify

      # Last on purpose: a failure in any gate above must not hide it, and it must not hide
      # them. It checks the built artifact through `vite preview`, never the dev server,
      # because only the build carries the inlined assets and the real chunk layout.
      # BM_CHROME points the script at the Chrome the runner image ships, so no browser
      # download is needed; the script reads it before it goes looking for a macOS cache path.
      - name: Real-browser gameplay check (desktop & mobile viewports)
        env:
          BM_CHROME: /usr/bin/google-chrome
        run: |
          npx vite preview --port 5199 --strictPort &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5199/games/ >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "vite preview tidak naik dalam 30 detik di http://localhost:5199/games"
            exit 1
          fi
          npm run gameplay:check -- http://localhost:5199/games

  deploy-to-vercel:
    name: Deploy to Vercel
    needs: audit-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Inject Supabase Credentials into Vercel Build Environment
        run: |
          mkdir -p .vercel
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .vercel/.env.production.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .vercel/.env.production.local

      - name: Build Project Artifacts
        run: npx vercel build --prod --token=$VERCEL_TOKEN
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Vercel Production Deployment Success!" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Games Hub:** $DEPLOY_URL/games/" >> $GITHUB_STEP_SUMMARY

      # Runs against the live alias, not the deployment URL, because the two routing rules we
      # care about are the SPA fallback for deep links and the 404 for a missing hashed asset.
      # A missing asset must never come back as HTML: that is how four games went dead on
      # 17 October, when the HTML fallback got cached as JavaScript for a year.
      - name: Verify deployed routing
        run: |
          set -e
          BASE=https://www.ivanjairus.xyz/games
          PROBE=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          deep=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/bomberman/local?probe=$PROBE")
          missing=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/assets/DefinitelyMissing-$PROBE.js?probe=$PROBE")
          real=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/manifest.webmanifest?probe=$PROBE")
          echo "deep link   : $deep"
          echo "aset hilang : $missing"
          echo "manifest    : $real"
          echo "$deep" | grep -q '^200 text/html' || { echo 'deep link SPA harus mengembalikan HTML'; exit 1; }
          echo "$missing" | grep -q '^404' || { echo 'aset yang hilang harus 404, bukan HTML'; exit 1; }
          echo "$real" | grep -q '^200 application/manifest+json' || { echo 'manifest harus tetap JSON'; exit 1; }
