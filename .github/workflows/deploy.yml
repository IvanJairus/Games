name: CI & Auto-Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# cancel-in-progress sengaja dimatikan: dua deploy produksi yang tumpang tindih
# meninggalkan deployment dengan HTML dan aset dari build berbeda, dan browser
# menyimpan respons HTML itu sebagai JS selama setahun karena header immutable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  audit-and-test:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc -b

      - name: Run Game Engine Unit Tests
        run: npm run test:unit

      - name: Run Viewport UI Automation (Desktop & Mobile)
        run: npm run test:ui

      - name: Run Release Readiness Audit
        run: npm run release:check

      - name: Security & Domain Guard Check
        run: npm run guard:check

      # Needs no npm package and no built artifact: it raises its own throwaway Postgres in
      # Docker and applies the migrations. Last in the job on purpose, so a red run here says
      # something about the SQL and never hides the steps above it.
      - name: Verify SQL Migrations and Protocol Assertions
        run: npm run db:verify

      # Last on purpose: a failure in any gate above must not hide it, and it must not hide
      # them. It checks the built artifact through `vite preview`, never the dev server,
      # because only the build carries the inlined assets and the real chunk layout.
      # BM_CHROME points the script at the Chrome the runner image ships, so no browser
      # download is needed; the script reads it before it goes looking for a macOS cache path.
      - name: Real-browser gameplay check (desktop & mobile viewports)
        env:
          BM_CHROME: /usr/bin/google-chrome
        run: |
          npx vite preview --port 5199 --strictPort &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5199/games/ >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "vite preview tidak naik dalam 30 detik di http://localhost:5199/games"
            exit 1
          fi
          npm run gameplay:check -- http://localhost:5199/games

  deploy-to-vercel:
    name: Deploy to Vercel
    needs: audit-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Hanya token yang dipakai. VERCEL_ORG_ID/VERCEL_PROJECT_ID sengaja TIDAK dibaca di sini:
      # keduanya id opaque yang berubah setiap kali project di-relink atau dibuat ulang, dan
      # begitu basi `vercel pull` gagal dengan "Could not retrieve Project Settings" tanpa cara
      # memperbaikinya dari dalam workflow. Nama project + slug scope stabil, jadi project
      # di-link ulang dari situ setiap run.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ij-games
      VERCEL_SCOPE: ivanjairus-projects
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Self-healing link: resolves the project by name and writes .vercel/project.json, so a
      # project that was re-created or moved links itself again instead of depending on an
      # opaque id that rots. The default scope is tried first (a personal token usually owns
      # the project directly); the team slug is only the fallback.
      - name: Link and pull the Vercel project
        id: pull
        # A dead token must not leave a red X on a commit the Git integration deployed. This
        # step records whether the CLI path is usable and always exits 0; the fallback step
        # below asserts the deployment that actually happened.
        run: |
          set +e
          npx vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
          LINK=$?
          if [ "$LINK" -ne 0 ]; then
            echo "::warning::Link with the default scope failed; retrying with scope '$VERCEL_SCOPE'."
            npx vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            LINK=$?
          fi
          PULL=1
          if [ "$LINK" -eq 0 ]; then
            npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
            PULL=$?
          fi
          if [ "$PULL" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel CLI is unusable::The CLI could not link or read the project. 'The specified scope does not exist' means VERCEL_TOKEN is expired or revoked, not that the project is gone. Production is deployed by the Vercel Git integration; this job asserts that deployment instead."
          fi
          exit 0

      - name: Inject Supabase and Worker Credentials into Vercel Build Environment
        if: steps.pull.outputs.ok == 'true'
        run: |
          mkdir -p .vercel
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .vercel/.env.production.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .vercel/.env.production.local
          # The transport flag is a build-time switch. Keeping it next to the Supabase
          # credentials means a CLI deploy can never ship a bundle that still points at
          # Broadcast while the Worker is the thing being verified.
          echo "VITE_TRANSPORT=cloudflare" >> .vercel/.env.production.local
          echo "VITE_CF_ROOMS_URL=https://ij-game-rooms.filemonivanjairus.workers.dev" >> .vercel/.env.production.local

      - name: Build Project Artifacts
        if: steps.pull.outputs.ok == 'true'
        run: npx vercel build --prod --token "$VERCEL_TOKEN"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TRANSPORT: cloudflare
          VITE_CF_ROOMS_URL: https://ij-game-rooms.filemonivanjairus.workers.dev

      # A green deploy that shipped the Broadcast bundle is the exact failure this flag
      # already caused once. Assert the Worker URL is physically in the lazy chunk.
      - name: Assert the Worker transport is in the build
        if: steps.pull.outputs.ok == 'true'
        run: |
          set -e
          shopt -s nullglob
          files=(dist/games/assets/v2/BombermanMatch-*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "BombermanMatch chunk tidak ditemukan di dist/games/assets/v2"
            exit 1
          fi
          if ! grep -q "workers.dev" "${files[@]}"; then
            echo "Transport Worker tidak ikut ke bundle: VITE_TRANSPORT/VITE_CF_ROOMS_URL hilang"
            exit 1
          fi
          echo "Transport Worker terverifikasi di ${files[*]}"

      - name: Deploy to Vercel (Production)
        if: steps.pull.outputs.ok == 'true'
        id: deploy
        run: |
          DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Vercel Production Deployment Success!" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Games Hub:** $DEPLOY_URL/games/" >> $GITHUB_STEP_SUMMARY

      # Runs against the live alias, not the deployment URL, because what we care about is how
      # the deployed routing behaves: deep links must keep serving the SPA, and the manifest must
      # keep its own content type. A missing hashed asset is measured and reported but not
      # asserted yet: an attempt to exclude /games/assets/* from the SPA fallback shipped in
      # 0209a5de and did not work, Vercel still answers those URLs with index.html. That fallback
      # is what made the 17 October outage stick, because the immutable asset header caches the
      # HTML as JavaScript for a year. The client reloads once instead (ErrorBoundary), which is
      # the part that actually protects players today.
      - name: Verify deployed routing
        if: steps.pull.outputs.ok == 'true'
        run: |
          BASE=https://www.ivanjairus.xyz/games
          PROBE=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          deep=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' -L "$BASE/bomberman/local?probe=$PROBE")
          real=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/manifest.webmanifest?probe=$PROBE")
          missing=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/assets/DefinitelyMissing-$PROBE.js?probe=$PROBE")
          echo "deep link   : $deep"
          echo "manifest    : $real"
          echo "aset hilang : $missing  (diharapkan 404, masih HTML selama fallback SPA menelan /games/assets/*)"
          echo "$deep" | grep -q '^200 text/html' || { echo 'deep link SPA harus mengembalikan HTML'; exit 1; }
          echo "$real" | grep -q '^200 application/manifest+json' || { echo 'manifest harus tetap JSON'; exit 1; }

      # The CLI is only one of two deployers. When it cannot read the project, the Vercel Git
      # integration still deploys `main`; this asserts that the Production deployment for THIS
      # commit actually reached success, so the job is green only when production is really live.
      - name: Assert production was deployed by the Git integration
        if: steps.pull.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning title=Vercel CLI could not read the project::vercel pull failed, so the CLI deploy is skipped. Production is deployed by the Vercel Git integration; asserting that deployment for ${GITHUB_SHA} instead."
          for attempt in $(seq 1 12); do
            DEP_ID=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Production&per_page=1" --jq '.[0].id // empty' 2>/dev/null || true)
            if [ -n "$DEP_ID" ]; then
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEP_ID}/statuses?per_page=1" --jq '.[0].state // empty' 2>/dev/null || true)
              echo "attempt ${attempt}: deployment ${DEP_ID} -> ${STATE}"
              if [ "$STATE" = "success" ]; then
                echo "### ✅ Production deployed by the Vercel Git integration" >> "$GITHUB_STEP_SUMMARY"
                echo "- commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
                echo "- deployment: ${DEP_ID}" >> "$GITHUB_STEP_SUMMARY"
                echo "- **Action required:** refresh VERCEL_TOKEN if you want the CLI path back." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              echo "attempt ${attempt}: no Production deployment for this commit yet"
            fi
            sleep 15
          done
          echo "::error title=Production not deployed::Neither the Vercel CLI nor the Vercel Git integration produced a successful Production deployment for ${GITHUB_SHA}."
          exit 1
